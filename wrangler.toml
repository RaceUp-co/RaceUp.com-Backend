name = "raceup-backend-api"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "RaceUp-User-Data"
database_id = "da5708b9-9979-44f1-a979-5a822bad00c1"

[[r2_buckets]]
binding = "R2"
bucket_name = "raceup-project-files"

# Limitation de debit par IP (src/middleware/rate-limit.ts)
# Connexion, inscription, OAuth, suppression de compte, login dashboard, paiement : 10 / minute
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Formulaires publics (support, demande de devis) : 5 / minute
[[ratelimits]]
name = "FORMS_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[vars]
ENVIRONMENT = "production"
ACCESS_TOKEN_EXPIRY = "900"
REFRESH_TOKEN_EXPIRY = "604800"
GOOGLE_CLIENT_ID = ""
APPLE_CLIENT_ID = ""
POLICY_VERSION = "v1.0.0"
# Paiements Stripe (secrets STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET via `wrangler secret put`)
SITE_URL = "https://race-up.net"
STRIPE_INVOICE_CREATION = "true"

# Emails transactionnels Resend (secret RESEND_API_KEY + RESEND_WEBHOOK_SECRET via
# `wrangler secret put`). Sans RESEND_API_KEY, les envois sont desactives proprement.
# L'expedition exige un domaine verifie dans Resend : race-up.net (DKIM + SPF + DMARC).
EMAIL_FROM = "no-reply@race-up.net"
EMAIL_FROM_NAME = "RaceUp"
EMAIL_REPLY_TO = "support@race-up.net"
# Destinataire des notifications internes (commandes, support, inscriptions)
EMAIL_ADMIN = "raceup.co@gmail.com"
DASHBOARD_URL = "https://raceup-backend-api.jacqueslucas-m2101.workers.dev/dashboard"

# Observabilité Cloudflare
[observability]
[observability.logs]
enabled = false
invocation_logs = true
